AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 bucket and Lambda cleanup (CloudFormation sample)'
Resources:
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private

  CleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: CleanupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  CleanupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs18.x
      Role: !GetAtt CleanupRole.Arn
      Code:
        ZipFile: |
          exports.handler = async function(event) { console.log('Use Terraform for production'); }
